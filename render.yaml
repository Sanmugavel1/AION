services:
  - type: web
    name: aion-backend
    runtime: python
    plan: free
    rootDir: finals-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/aion.db
      - key: GRAPH_STORE_PATH
        value: ./data/graph_store.json
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["http://localhost:5500"]'
      # Matches the production Vercel domain and every preview deployment
      # for the aion frontend project (e.g. aion-<hash>-<team>.vercel.app,
      # aion-git-<branch>-<team>.vercel.app). Update if the Vercel project
      # is named differently or a custom domain is added.
      - key: ALLOWED_ORIGIN_REGEX
        value: '^https://aion(-[a-z0-9-]+)?\.vercel\.app$'
